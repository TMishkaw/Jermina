services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jemini_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jemini}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jemini}"]
      interval: 5s
      timeout: 5s
      retries: 5

  remotion:
    build:
      context: ./remotion
      dockerfile: Dockerfile
    container_name: jemini_remotion
    volumes:
      - ./remotion:/app
      - /app/node_modules
      - ./output:/app/out
    profiles:
      - render

volumes:
  postgres_data:
    driver: local
